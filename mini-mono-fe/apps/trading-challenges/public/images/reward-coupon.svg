<svg width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 优惠券背景 -->
  <rect x="12" y="24" width="60" height="36" rx="4" fill="url(#couponGradient)"/>
  
  <!-- 左侧圆形缺口 -->
  <circle cx="12" cy="42" r="4" fill="#1D1D1D"/>
  
  <!-- 右侧圆形缺口 -->
  <circle cx="72" cy="42" r="4" fill="#1D1D1D"/>
  
  <!-- 中间虚线 -->
  <line x1="12" y1="42" x2="72" y2="42" stroke="#C9A86A" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
  
  <!-- 百分号装饰 -->
  <g transform="translate(30, 32)">
    <!-- % 符号 -->
    <circle cx="4" cy="4" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="20" cy="16" r="3" fill="#FFFFFF" opacity="0.9"/>
    <line x1="6" y1="2" x2="18" y2="18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="couponGradient" x1="12" y1="42" x2="72" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6C576"/>
      <stop offset="50%" stop-color="#F4D998"/>
      <stop offset="100%" stop-color="#E6C576"/>
    </linearGradient>
  </defs>
  
  <!-- 装饰小点 -->
  <circle cx="20" cy="28" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="64" cy="28" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="20" cy="56" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="64" cy="56" r="1" fill="#FFFFFF" opacity="0.5"/>
</svg>

