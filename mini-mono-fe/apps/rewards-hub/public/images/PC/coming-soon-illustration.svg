<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9360FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9360FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="200" cy="200" r="180" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="200" cy="200" r="120" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Main geometric shapes -->
  <path d="M120 160 L200 120 L280 160 L280 240 L200 280 L120 240 Z" fill="url(#grad2)" opacity="0.6"/>
  <path d="M160 180 L200 160 L240 180 L240 220 L200 240 L160 220 Z" fill="#9360FF" opacity="0.8"/>
  
  <!-- Floating elements -->
  <circle cx="100" cy="120" r="8" fill="#9360FF" opacity="0.6">
    <animate attributeName="cy" values="120;110;120" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="140" r="6" fill="#007AFF" opacity="0.7">
    <animate attributeName="cy" values="140;130;140" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="280" r="4" fill="#9360FF" opacity="0.5">
    <animate attributeName="cy" values="280;270;280" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="300" r="5" fill="#007AFF" opacity="0.6">
    <animate attributeName="cy" values="300;290;300" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central icon -->
  <circle cx="200" cy="200" r="30" fill="rgba(147, 96, 255, 0.2)" stroke="#9360FF" stroke-width="2"/>
  <path d="M190 190 L210 200 L190 210 Z" fill="#9360FF"/>
</svg>