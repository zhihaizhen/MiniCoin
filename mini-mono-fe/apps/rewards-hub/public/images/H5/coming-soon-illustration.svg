<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9360FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9360FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background circles -->
  <circle cx="120" cy="120" r="100" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="120" cy="120" r="70" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Main geometric shapes -->
  <path d="M80 100 L120 80 L160 100 L160 140 L120 160 L80 140 Z" fill="url(#grad2)" opacity="0.6"/>
  <path d="M100 110 L120 100 L140 110 L140 130 L120 140 L100 130 Z" fill="#9360FF" opacity="0.8"/>
  
  <!-- Floating elements -->
  <circle cx="60" cy="70" r="5" fill="#9360FF" opacity="0.6">
    <animate attributeName="cy" values="70;65;70" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="80" r="4" fill="#007AFF" opacity="0.7">
    <animate attributeName="cy" values="80;75;80" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="170" r="3" fill="#9360FF" opacity="0.5">
    <animate attributeName="cy" values="170;165;170" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="180" r="4" fill="#007AFF" opacity="0.6">
    <animate attributeName="cy" values="180;175;180" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central icon -->
  <circle cx="120" cy="120" r="20" fill="rgba(147, 96, 255, 0.2)" stroke="#9360FF" stroke-width="2"/>
  <path d="M115 115 L125 120 L115 125 Z" fill="#9360FF"/>
</svg>